  <script>
    window.__JAEDER_BOOT_WATCHDOG__ = window.setTimeout(function () {
      var screen = document.querySelector("[data-jaeder-boot-screen]");
      if (!screen) return;
      var message = screen.querySelector("[data-jaeder-boot-message]");
      var retry = screen.querySelector("[data-jaeder-boot-retry]");
      if (message) message.textContent = "La carga está tardando más de lo esperado. Puede reintentar sin cerrar la sesión.";
      if (retry) {
        retry.hidden = false;
        retry.onclick = function () { window.location.reload(); };
      }
    }, 12000);
    window.addEventListener("error", function (event) {
      var screen = document.querySelector("[data-jaeder-boot-screen]");
      if (!screen) return;
      var message = screen.querySelector("[data-jaeder-boot-message]");
      var retry = screen.querySelector("[data-jaeder-boot-retry]");
      if (message) message.textContent = "No se pudo completar el inicio. Actualice la página para reintentar.";
      if (retry) {
        retry.hidden = false;
        retry.onclick = function () { window.location.reload(); };
      }
      console.error("[jaeder-boot] Error previo al arranque", event.error || event.message);
    });
    if (window.location.protocol === "file:") {
      window.__ERP_LOCAL_MODE__ = true;
      window.__ERP_ENV__ = {
        ...(window.__ERP_ENV__ || {}),
        VITE_SUPABASE_ENABLED: "false",
        VITE_ENABLE_AUTH: "false",
        VITE_ENABLE_RLS: "false",
        VITE_ENABLE_CORE_SUPABASE: "false",
        VITE_ENABLE_ACCOUNTING_SUPABASE: "false",
        VITE_ENABLE_COMMERCIAL_CATALOGS_SUPABASE: "false",
        VITE_ENABLE_COMMERCIAL_ORDERS_SUPABASE: "false",
        VITE_ENABLE_OPERATIONS_SUPABASE: "false",
        VITE_ENABLE_SCANNER_SUPABASE: "false",
        VITE_ENABLE_MATERIAL_INVENTORY_SUPABASE: "false",
        VITE_ENABLE_SRI_SUPABASE: "false",
        VITE_APP_ENV: "local",
        VITE_COMPANY_MODE: "multi"
      };
    }
  </script>
